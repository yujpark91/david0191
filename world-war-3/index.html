<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD WAR 3 - 탱크 전쟁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #14140f;
    color: #fff;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 10px;
    color: #e8d27a;
    letter-spacing: 6px;
    text-shadow: 0 0 10px #c9a227, 2px 2px 0 #3a2f10;
  }

  /* 게임 화면을 감싸는 상자 */
  #wrap {
    position: relative;
    width: 960px;
    max-width: 96vw;
    aspect-ratio: 3 / 2;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 3px solid #5a5233;
    border-radius: 6px;
    cursor: crosshair;
  }

  /* 시작 / 게임 오버 / 승리 화면 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 6, 0.75);
    border-radius: 6px;
  }
  #overlay.hidden { display: none; }

  #bigText {
    font-size: 76px;
    font-weight: bold;
    margin-bottom: 14px;
    letter-spacing: 4px;
  }

  #subText {
    font-size: 18px;
    margin-bottom: 28px;
    color: #e0dcc4;
    text-align: center;
    line-height: 1.8;
  }

  button {
    font-family: inherit;
    font-size: 24px;
    padding: 14px 44px;
    border: 3px solid #2b2a14;
    border-radius: 8px;
    background: linear-gradient(#a9b45a, #6b7a2a);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    text-shadow: 1px 1px 0 #2b2a14;
  }
  button:hover { transform: scale(1.05); }

  #help {
    margin-top: 12px;
    font-size: 14px;
    color: #a09a80;
  }
</style>
</head>
<body>

<h1>WORLD WAR 3</h1>

<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>

  <div id="overlay">
    <div id="bigText"></div>
    <div id="subText"></div>
    <button id="startBtn">게임 시작</button>
  </div>
</div>

<p id="help">
  이동: W A S D 또는 방향키 &nbsp;|&nbsp; 포탑 조준: 마우스 &nbsp;|&nbsp; 발사: 마우스 클릭 또는 스페이스바
</p>

<script>
// ===== 기본 준비 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;   // 960
const H = canvas.height;  // 640

const overlay = document.getElementById('overlay');
const bigText = document.getElementById('bigText');
const subText = document.getElementById('subText');
const startBtn = document.getElementById('startBtn');

const TANK_R = 18;        // 탱크 크기 (부딪힘 계산용 반지름)
const LAST_WAVE = 5;      // 5번째 웨이브까지 이기면 승리

// 벽 (시멘트 블록, 나무 상자)
const walls = [
  { x: 180, y: 110, w: 120, h: 30 },
  { x: 660, y: 110, w: 120, h: 30 },
  { x: 180, y: 500, w: 120, h: 30 },
  { x: 660, y: 500, w: 120, h: 30 },
  { x: 455, y: 250, w: 50,  h: 140 },
  { x: 320, y: 300, w: 60,  h: 40, crate: true },
  { x: 580, y: 300, w: 60,  h: 40, crate: true },
  { x: 90,  y: 300, w: 40,  h: 40, crate: true },
  { x: 830, y: 300, w: 40,  h: 40, crate: true }
];

// 적 탱크가 나타나는 자리
const spawnPoints = [
  { x: 60, y: 50 }, { x: 480, y: 50 }, { x: 900, y: 50 },
  { x: 60, y: 220 }, { x: 900, y: 220 },
  { x: 60, y: 420 }, { x: 900, y: 420 },
  { x: 60, y: 590 }, { x: 900, y: 590 }
];

// 땅 무늬 (풀, 돌, 구덩이) - 처음에 한 번만 만들어 둠
const groundSpots = [];
for (let i = 0; i < 140; i++) {
  groundSpots.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 14 + 3,
    type: Math.random() < 0.15 ? 'crater' : (Math.random() < 0.5 ? 'grass' : 'stone')
  });
}

// 게임 상태: 'start', 'play', 'over', 'win'
let state = 'start';
let player, enemies, shells, particles, trackMarks;
let wave, score, waveTimer, message, messageTimer, shake;
let frame = 0;

const keys = {};
let mouseX = W / 2, mouseY = 0;
let mouseDown = false;

// ===== 작은 도우미 함수들 =====

// 각도 차이를 -180도 ~ 180도 사이로 맞추기
function angleDiff(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// 각도 a를 목표 b 쪽으로 조금씩 돌리기 (최대 step 만큼)
function turnToward(a, b, step) {
  const d = angleDiff(a, b);
  if (Math.abs(d) <= step) return b;
  return a + Math.sign(d) * step;
}

// 동그라미(탱크)가 사각형(벽)과 겹치는지
function circleHitsRect(x, y, r, rect) {
  const cx = Math.max(rect.x, Math.min(x, rect.x + rect.w));
  const cy = Math.max(rect.y, Math.min(y, rect.y + rect.h));
  return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
}

// 점이 벽 안에 있는지
function pointInWall(x, y) {
  return walls.some(w => x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h);
}

// 탱크가 이 자리에 있을 수 있는지 (벽, 화면 끝 확인)
function canStand(x, y) {
  if (x < TANK_R || x > W - TANK_R || y < TANK_R || y > H - TANK_R) return false;
  return !walls.some(w => circleHitsRect(x, y, TANK_R, w));
}

// 탱크 이동 (가로, 세로 따로 확인해서 벽에 미끄러지듯 움직임)
function moveTank(t, dx, dy) {
  let moved = false;
  if (canStand(t.x + dx, t.y)) { t.x += dx; moved = true; }
  if (canStand(t.x, t.y + dy)) { t.y += dy; moved = true; }
  return moved;
}

// 두 점 사이에 벽이 없는지 (적이 나를 볼 수 있는지)
function canSee(x1, y1, x2, y2) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.ceil(dist / 10);
  for (let i = 1; i < steps; i++) {
    const x = x1 + (x2 - x1) * i / steps;
    const y = y1 + (y2 - y1) * i / steps;
    if (pointInWall(x, y)) return false;
  }
  return true;
}

// ===== 게임 시작 / 끝 =====
function resetGame() {
  player = {
    x: W / 2, y: 590,
    angle: -Math.PI / 2,   // 차체 방향 (위쪽)
    turret: -Math.PI / 2,  // 포탑 방향
    speed: 0,
    moveDir: -Math.PI / 2, // 움직이는 방향 (화면 기준)
    hp: 100, maxHp: 100,
    cooldown: 0,
    tread: 0,              // 바퀴(궤도) 굴러가는 모양
    flash: 0,              // 포를 쏠 때 번쩍임
    alive: true
  };
  enemies = [];
  shells = [];
  particles = [];
  trackMarks = [];
  wave = 0;
  score = 0;
  shake = 0;
  message = '';
  messageTimer = 0;
  waveTimer = 60;          // 잠시 후 첫 웨이브 시작
}

function showOverlay(title, color, sub, btnText) {
  bigText.textContent = title;
  bigText.style.color = color;
  bigText.style.textShadow = '0 0 24px ' + color + ', 3px 3px 0 #000';
  subText.innerHTML = sub;
  startBtn.textContent = btnText;
  overlay.classList.remove('hidden');
}

function startGame() {
  resetGame();
  state = 'play';
  overlay.classList.add('hidden');
  startBtn.blur();
}

function endGame(win) {
  state = win ? 'win' : 'over';
  setTimeout(() => {
    if (win) {
      showOverlay('승리!', '#e8d27a',
        '모든 적 탱크 부대를 물리쳤습니다!<br>점수: ' + score, '다시 하기');
    } else {
      showOverlay('게임 오버', '#ff5a3c',
        '웨이브 ' + wave + '에서 탱크가 파괴되었습니다.<br>점수: ' + score, '다시 하기');
    }
  }, 900);
}

startBtn.addEventListener('click', startGame);

// 다음 웨이브의 적 탱크 만들기
function spawnWave() {
  wave++;
  const count = Math.min(2 + wave, 8);  // 웨이브마다 적이 늘어남
  // 내 탱크에서 먼 자리부터 사용
  const points = spawnPoints
    .slice()
    .sort((a, b) => Math.hypot(b.x - player.x, b.y - player.y) - Math.hypot(a.x - player.x, a.y - player.y));

  for (let i = 0; i < count; i++) {
    const p = points[i % points.length];
    const toPlayer = Math.atan2(player.y - p.y, player.x - p.x);
    const heavy = wave >= 3 && i % 3 === 0;  // 3웨이브부터 튼튼한 탱크 등장
    enemies.push({
      x: p.x, y: p.y,
      angle: toPlayer,
      turret: toPlayer,
      goal: toPlayer,
      hp: heavy ? 100 : 50,
      maxHp: heavy ? 100 : 50,
      heavy: heavy,
      cooldown: 80 + Math.random() * 80,
      think: 0,
      tread: 0,
      flash: 0
    });
  }
  message = '웨이브 ' + wave;
  messageTimer = 100;
}

// ===== 키보드 / 마우스 =====
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('mousedown', () => { mouseDown = true; });
window.addEventListener('mouseup', () => { mouseDown = false; });

// 포탄 발사
function fire(t, owner) {
  const len = 30; // 포신 길이
  const sx = t.x + Math.cos(t.turret) * len;
  const sy = t.y + Math.sin(t.turret) * len;
  const sp = owner === 'player' ? 10 : 6.5;
  shells.push({
    x: sx, y: sy,
    vx: Math.cos(t.turret) * sp,
    vy: Math.sin(t.turret) * sp,
    owner: owner,
    life: 120
  });
  t.flash = 6;
  // 쏘면 탱크가 살짝 뒤로 밀림
  moveTank(t, -Math.cos(t.turret) * 2, -Math.sin(t.turret) * 2);
  smoke(sx, sy, 4);
}

// 폭발 효과
function explode(x, y, big) {
  const n = big ? 50 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * (big ? 5 : 3) + 0.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 25 + Math.random() * 25,
      size: Math.random() * 4 + 2,
      color: ['#ffd23f', '#ff8c1a', '#ff4d1a', '#fff3b0'][Math.floor(Math.random() * 4)]
    });
  }
  smoke(x, y, big ? 16 : 5);
  shake = Math.max(shake, big ? 12 : 4);
}

// 연기 효과
function smoke(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      life: 40 + Math.random() * 30,
      size: Math.random() * 8 + 6,
      color: 'smoke'
    });
  }
}

// 바닥에 바퀴 자국 남기기
function leaveTracks(t) {
  if (frame % 5 !== 0) return;
  trackMarks.push({ x: t.x, y: t.y, a: t.angle, life: 400 });
  if (trackMarks.length > 500) trackMarks.shift();
}

// ===== 게임 움직임 계산 =====
function update() {
  // --- 내 탱크 운전 ---
  const up    = keys['KeyW'] || keys['ArrowUp'];
  const down  = keys['KeyS'] || keys['ArrowDown'];
  const left  = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];

  // 화면 기준으로 방향 정하기 (위 키 = 화면 위쪽, 왼쪽 키 = 화면 왼쪽)
  let ix = 0, iy = 0;
  if (up)    iy -= 1;
  if (down)  iy += 1;
  if (left)  ix -= 1;
  if (right) ix += 1;

  if (ix !== 0 || iy !== 0) {
    player.moveDir = Math.atan2(iy, ix);
    player.speed = Math.min(player.speed + 0.15, 3);
    // 차체는 가는 방향으로 부드럽게 돌아감 (보이는 모양만 바뀜)
    player.angle = turnToward(player.angle, player.moveDir, 0.15);
  } else {
    player.speed *= 0.88;   // 키를 떼면 천천히 멈춤
  }

  if (player.speed > 0.05) {
    moveTank(player, Math.cos(player.moveDir) * player.speed, Math.sin(player.moveDir) * player.speed);
    player.tread += player.speed;
    leaveTracks(player);
  }

  // --- 포탑은 마우스 쪽으로 따로 돌아감 ---
  const aim = Math.atan2(mouseY - player.y, mouseX - player.x);
  player.turret = turnToward(player.turret, aim, 0.09);

  // --- 발사 ---
  if (player.cooldown > 0) player.cooldown--;
  if ((mouseDown || keys['Space']) && player.cooldown <= 0) {
    fire(player, 'player');
    player.cooldown = 30; // 0.5초에 한 발
  }
  if (player.flash > 0) player.flash--;

  // --- 적 탱크 움직임 ---
  for (const e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const toPlayer = Math.atan2(dy, dx);

    // 가끔씩 어디로 갈지 새로 정함
    e.think--;
    if (e.think <= 0) {
      e.think = 60 + Math.random() * 70;
      if (dist > 260) {
        e.goal = toPlayer + (Math.random() - 0.5) * 0.9;        // 다가오기
      } else {
        e.goal = toPlayer + (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2; // 옆으로 돌기
      }
    }

    e.angle = turnToward(e.angle, e.goal, 0.04);
    const sp = (e.heavy ? 0.9 : 1.3) + wave * 0.1;
    const moved = moveTank(e, Math.cos(e.angle) * sp, Math.sin(e.angle) * sp);
    if (!moved) {
      // 막히면 다른 방향으로
      e.goal = e.angle + Math.PI / 2 + Math.random() * Math.PI;
      e.think = 40;
    } else {
      e.tread += sp;
      leaveTracks(e);
    }

    // 포탑은 나를 따라 돌아감
    e.turret = turnToward(e.turret, toPlayer, 0.025 + wave * 0.004);

    // 조준이 맞고, 벽에 가리지 않으면 발사
    e.cooldown--;
    if (e.cooldown <= 0 &&
        Math.abs(angleDiff(e.turret, toPlayer)) < 0.12 &&
        dist < 560 &&
        canSee(e.x, e.y, player.x, player.y)) {
      fire(e, 'enemy');
      e.cooldown = Math.max(60, 130 - wave * 12) + Math.random() * 60;
    }
    if (e.flash > 0) e.flash--;
  }

  // --- 탱크끼리 겹치지 않게 밀어내기 ---
  const tanks = [player, ...enemies];
  for (let i = 0; i < tanks.length; i++) {
    for (let j = i + 1; j < tanks.length; j++) {
      const a = tanks[i], b = tanks[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d > 0 && d < TANK_R * 2) {
        const push = (TANK_R * 2 - d) / 2;
        moveTank(a, -dx / d * push, -dy / d * push);
        moveTank(b, dx / d * push, dy / d * push);
      }
    }
  }

  // --- 포탄 이동과 명중 ---
  for (const s of shells) {
    s.x += s.vx;
    s.y += s.vy;
    s.life--;

    // 벽이나 화면 밖
    if (pointInWall(s.x, s.y) || s.x < 0 || s.x > W || s.y < 0 || s.y > H) {
      s.life = 0;
      explode(s.x, s.y, false);
      continue;
    }

    if (s.owner === 'player') {
      for (const e of enemies) {
        if (Math.hypot(s.x - e.x, s.y - e.y) < TANK_R + 3) {
          e.hp -= 25;
          s.life = 0;
          explode(s.x, s.y, false);
          if (e.hp <= 0) {
            score += e.heavy ? 200 : 100;
            explode(e.x, e.y, true);
          }
          break;
        }
      }
    } else if (Math.hypot(s.x - player.x, s.y - player.y) < TANK_R + 3) {
      player.hp -= 12;
      s.life = 0;
      explode(s.x, s.y, false);
      shake = Math.max(shake, 6);
    }
  }
  shells = shells.filter(s => s.life > 0);
  enemies = enemies.filter(e => e.hp > 0);

  // --- 내 탱크가 파괴되었는지 ---
  if (player.hp <= 0) {
    player.hp = 0;
    player.alive = false;
    explode(player.x, player.y, true);
    explode(player.x, player.y, true);
    endGame(false);
    return;
  }

  // --- 웨이브 관리 ---
  if (enemies.length === 0) {
    if (waveTimer > 0) {
      waveTimer--;
      if (waveTimer === 0) spawnWave();
    } else if (wave >= LAST_WAVE) {
      endGame(true);
    } else {
      // 웨이브 클리어! 체력을 조금 회복하고 잠시 쉼
      message = '웨이브 ' + wave + ' 클리어!  체력 +30';
      messageTimer = 120;
      player.hp = Math.min(player.maxHp, player.hp + 30);
      waveTimer = 150;
    }
  }
}

// ===== 그리기 =====
function drawGround() {
  ctx.fillStyle = '#5b5a3a';
  ctx.fillRect(0, 0, W, H);

  for (const g of groundSpots) {
    if (g.type === 'crater') {
      ctx.fillStyle = '#46452c';
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3c3b25';
      ctx.beginPath(); ctx.arc(g.x + 2, g.y + 2, g.r, 0, Math.PI * 2); ctx.fill();
    } else if (g.type === 'grass') {
      ctx.fillStyle = '#6a6b40';
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#75705a';
      ctx.fillRect(g.x, g.y, g.r * 0.4, g.r * 0.3);
    }
  }

  // 바퀴 자국
  for (const m of trackMarks) {
    m.life--;
    ctx.save();
    ctx.globalAlpha = Math.max(0, m.life / 400) * 0.35;
    ctx.translate(m.x, m.y);
    ctx.rotate(m.a);
    ctx.fillStyle = '#2a2918';
    ctx.fillRect(-3, -16, 6, 5);
    ctx.fillRect(-3, 11, 6, 5);
    ctx.restore();
  }
  trackMarks = trackMarks.filter(m => m.life > 0);
}

function drawWalls() {
  for (const w of walls) {
    if (w.crate) {
      // 나무 상자
      ctx.fillStyle = '#8a6a3a';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#4e3a1c';
      ctx.lineWidth = 3;
      ctx.strokeRect(w.x + 1.5, w.y + 1.5, w.w - 3, w.h - 3);
      ctx.beginPath();
      ctx.moveTo(w.x + 3, w.y + 3); ctx.lineTo(w.x + w.w - 3, w.y + w.h - 3);
      ctx.moveTo(w.x + w.w - 3, w.y + 3); ctx.lineTo(w.x + 3, w.y + w.h - 3);
      ctx.stroke();
    } else {
      // 시멘트 블록
      ctx.fillStyle = '#3a3a34';
      ctx.fillRect(w.x + 4, w.y + 4, w.w, w.h); // 그림자
      ctx.fillStyle = '#8d8b80';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#6a685e';
      ctx.lineWidth = 2;
      // 벽돌 줄무늬
      const horizontal = w.w > w.h;
      const size = 30;
      ctx.beginPath();
      if (horizontal) {
        for (let x = w.x + size; x < w.x + w.w; x += size) {
          ctx.moveTo(x, w.y); ctx.lineTo(x, w.y + w.h);
        }
      } else {
        for (let y = w.y + size; y < w.y + w.h; y += size) {
          ctx.moveTo(w.x, y); ctx.lineTo(w.x + w.w, y);
        }
      }
      ctx.stroke();
      ctx.strokeStyle = '#4a4940';
      ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    }
  }
}

// 탱크 그리기 (차체 + 궤도 + 포탑)
function drawTank(t, colors) {
  ctx.save();
  ctx.translate(t.x, t.y);

  // --- 차체 (차체 방향으로 회전) ---
  ctx.save();
  ctx.rotate(t.angle);

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-20, -17, 44, 38);

  // 양쪽 궤도 (바퀴 띠)
  ctx.fillStyle = '#2b2b26';
  ctx.fillRect(-22, -19, 44, 10);
  ctx.fillRect(-22, 9, 44, 10);
  // 궤도 줄무늬 (움직이면 굴러가 보임)
  ctx.strokeStyle = '#55554a';
  ctx.lineWidth = 2;
  const offset = ((t.tread % 6) + 6) % 6;
  ctx.beginPath();
  for (let x = -22 + offset; x < 22; x += 6) {
    ctx.moveTo(x, -19); ctx.lineTo(x, -9);
    ctx.moveTo(x, 9); ctx.lineTo(x, 19);
  }
  ctx.stroke();

  // 몸통
  ctx.fillStyle = colors.body;
  ctx.fillRect(-18, -11, 36, 22);
  ctx.fillStyle = colors.dark;
  ctx.fillRect(12, -11, 6, 22);       // 앞부분
  ctx.fillRect(-18, -11, 4, 22);      // 뒷부분
  ctx.restore();

  // --- 포탑 (마우스 쪽으로 따로 회전) ---
  ctx.save();
  ctx.rotate(t.turret);

  // 포신
  ctx.fillStyle = colors.dark;
  ctx.fillRect(0, -3.5, 30, 7);
  ctx.fillStyle = '#222';
  ctx.fillRect(26, -4.5, 6, 9);       // 포구

  // 포를 쏘면 번쩍
  if (t.flash > 0) {
    ctx.fillStyle = '#ffe680';
    ctx.beginPath();
    ctx.moveTo(32, -7); ctx.lineTo(46, 0); ctx.lineTo(32, 7);
    ctx.fill();
  }

  // 포탑 몸
  ctx.fillStyle = colors.turret;
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = colors.dark;
  ctx.lineWidth = 2;
  ctx.stroke();
  // 해치 (뚜껑)
  ctx.fillStyle = colors.dark;
  ctx.beginPath();
  ctx.arc(-3, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore();
}

// 체력 막대
function drawHpBar(x, y, w, hp, maxHp, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x - 1, y - 1, w + 2, 7);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * (hp / maxHp), 5);
}

function draw() {
  ctx.save();

  // 화면 흔들림
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if (shake < 0.5) shake = 0;
  }

  drawGround();
  drawWalls();

  // 적 탱크 (일반: 붉은 회색 / 튼튼한 탱크: 검붉은색)
  for (const e of enemies) {
    drawTank(e, e.heavy
      ? { body: '#5a2a2a', dark: '#2e1414', turret: '#733434' }
      : { body: '#8a4b3c', dark: '#4a2820', turret: '#a35a48' });
    drawHpBar(e.x - 20, e.y - 32, 40, e.hp, e.maxHp, '#ff5a3c');
  }

  // 내 탱크 (올리브 초록색)
  if (player.alive) {
    drawTank(player, { body: '#6b7a2a', dark: '#3c4614', turret: '#86973a' });
  }

  // 포탄
  for (const s of shells) {
    ctx.fillStyle = s.owner === 'player' ? '#fff3b0' : '#ffb0a0';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 4, 0, Math.PI * 2);
    ctx.fill();
    // 꼬리
    ctx.strokeStyle = s.owner === 'player' ? 'rgba(255,230,128,0.5)' : 'rgba(255,120,90,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 2, s.y - s.vy * 2);
    ctx.stroke();
  }

  // 폭발, 연기
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life--;
    if (p.color === 'smoke') {
      ctx.globalAlpha = Math.max(0, p.life / 70) * 0.5;
      ctx.fillStyle = '#3a3a36';
      p.size += 0.3;
    } else {
      ctx.globalAlpha = Math.max(0, p.life / 50);
      ctx.fillStyle = p.color;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);

  ctx.restore();

  // 조준점
  if (state === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2);
    ctx.moveTo(mouseX - 15, mouseY); ctx.lineTo(mouseX - 5, mouseY);
    ctx.moveTo(mouseX + 5, mouseY); ctx.lineTo(mouseX + 15, mouseY);
    ctx.moveTo(mouseX, mouseY - 15); ctx.lineTo(mouseX, mouseY - 5);
    ctx.moveTo(mouseX, mouseY + 5); ctx.lineTo(mouseX, mouseY + 15);
    ctx.stroke();
  }

  drawHud();
}

// 화면 위쪽 정보 (체력, 웨이브, 점수)
function drawHud() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, 36);

  ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText('체력', 14, 18);
  const hpColor = player.hp > 50 ? '#8fd14f' : (player.hp > 25 ? '#ffd23f' : '#ff5a3c');
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(60, 10, 200, 16);
  ctx.fillStyle = hpColor;
  ctx.fillRect(60, 10, 200 * (player.hp / player.maxHp), 16);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText('웨이브 ' + wave + ' / ' + LAST_WAVE + '   |   남은 적: ' + enemies.length, W / 2, 18);

  ctx.textAlign = 'right';
  ctx.fillText('점수: ' + score, W - 14, 18);

  // 가운데 큰 안내 문구
  if (messageTimer > 0) {
    messageTimer--;
    ctx.globalAlpha = Math.min(1, messageTimer / 30);
    ctx.font = 'bold 48px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#000';
    ctx.fillText(message, W / 2 + 3, H / 2 - 77);
    ctx.fillStyle = '#e8d27a';
    ctx.fillText(message, W / 2, H / 2 - 80);
    ctx.globalAlpha = 1;
  }
  ctx.textBaseline = 'alphabetic';
}

// ===== 계속 반복되는 게임 흐름 =====
function loop() {
  frame++;
  if (state === 'play') update();
  draw();
  requestAnimationFrame(loop);
}

// 처음 화면
resetGame();
showOverlay('WORLD WAR 3', '#e8d27a',
  '탱크를 몰고 포탑을 돌려 적 탱크 부대를 막아라!<br>' +
  'W A S D / 방향키: 운전 &nbsp;·&nbsp; 마우스: 포탑 조준 &nbsp;·&nbsp; 클릭 / 스페이스바: 발사<br>' +
  '웨이브 ' + LAST_WAVE + '까지 살아남으면 승리!',
  '게임 시작');
loop();
</script>
